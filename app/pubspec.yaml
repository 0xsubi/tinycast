name: tinycast
description: "Reel-to-reel podcast player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^2.0.0
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  liquid_glass_widgets: ^1.13.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4+2
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true

  fonts:
    - family: Special Elite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
