name: tinycast
description: "Reel-to-reel podcast player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Special Elite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
